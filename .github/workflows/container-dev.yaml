name: Upload Dev Docker Container

run-name: Container build by @${{ github.triggering_actor }}

permissions:
  packages: write
  contents: read

on:
  push:
    branches:
      - feature/docker-container

jobs:
  build:
    name: Upload Dev Container

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Development Branch
        uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build
        run: docker build -t ghcr.io/volublerobin7/cocktailcollator:dev .

      - name: Push
        run: docker push ghcr.io/volublerobin7/cocktailcollator:dev